name: Defect risk check

# Runs on every pull request that touches a .java file: scores each changed file with the saved model and
# shows the result directly in this run's own Summary page (click the run from the Actions tab -- you land
# straight on the Summary page; don't click into the job name, that's the step-by-step log view instead).
on:
  pull_request:
    paths:
      - "**/*.java"

permissions:
  contents: read
  pull-requests: write   # needed to post/update the PR comment

jobs:
  score-changed-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed so `git diff` against the PR's base commit works

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Per-file project comes from ci_project_map.json; --project is the fallback.
      # ci_check.py also checks the needed model files exist.
      - name: Score changed files and write summary
        id: risk_check
        run: |
          python scripts/ci_check.py --project camel --repo . \
            --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}
        continue-on-error: true   # let the summary/comment steps below still run even if files were flagged
                                   # (steps.risk_check.outcome below still sees the real pass/fail result)

      - name: Show report in run summary
        if: always()
        run: cat results/ci_risk_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: results/ci_risk_report.md

      - name: Fail the job if anything was flagged
        if: steps.risk_check.outcome == 'failure'
        run: exit 1
